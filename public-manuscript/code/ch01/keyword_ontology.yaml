# ─────────────────────────────────────────────────────────────────────────────
# Keyword Ontology for PGx Dissertation Literature Review
#
# SYSTEM DYNAMICS: causal_links section below defines directed causal edges.
# Link types:
#   feeds     — provides data/features as input (data flow)
#   enables   — infrastructure makes computation feasible
#   informs   — results explain or contextualize outcomes
#   causes    — directional causal relationship (clinical / epidemiological)
#   prevents  — balancing/constraint (reduces bias or risk)
#   reinforces — positive feedback loop (+)
#   balances  — negative feedback loop / dampening (−)
# ─────────────────────────────────────────────────────────────────────────────
# Source: Chapter 1 literature-search strategy
# Aligned to: RQ1, RQ2, N1–N6, Aims 1–4
# Used by: scripts/organize_by_ontology.R
# ─────────────────────────────────────────────────────────────────────────────

# Structure:
#   domain > subdomain > node
#     terms:    match strings for title/abstract tagging (case-insensitive)
#     searches: search-strategy group labels that feed this node
#     rq:       operational research questions answered (RQ1, RQ2, N1–N6)
#     aims:     dissertation aims supported (1–4)

clinical_outcomes:

  opioid_ed:
    label: "Opioid Use Disorder & ED Visits"
    ooda_phase: act
    rq: [RQ2]
    aims: [1, 2]
    searches: [11, 16]
    terms:
      - opioid use disorder
      - opioid dependence
      - opioid related
      - OUD
      - fentanyl
      - hydrocodone
      - oxycodone
      - morphine
      - buprenorphine
      - naloxone
      - methadone
      - substance use disorder
      - overdose
      - opioid overdose
      - opioid emergency
      - opioid emergency department
      - F11
      - opioid risk

  polypharmacy_ed:
    label: "Polypharmacy & Non-Opioid ED Visits"
    ooda_phase: act
    rq: [RQ1]
    aims: [2, 3]
    searches: [12, 13, 17]
    terms:
      - polypharmacy
      - multiple medications
      - drug combination
      - elderly medication
      - geriatric pharmacology
      - drug interaction
      - drug-drug interaction
      - DDI
      - synergistic drug
      - adverse drug event
      - adverse drug reaction
      - ADE
      - ADR
      - medication error
      - non-opioid emergency
      - inappropriate prescribing
      - beers criteria
      - potentially inappropriate medication

  pharmacovigilance:
    label: "Pharmacovigilance & Pharmacogenomics"
    ooda_phase: observe
    rq: [RQ1, RQ2]
    aims: [3]
    searches: [3]
    terms:
      - pharmacovigilance
      - drug safety
      - signal detection
      - spontaneous reporting
      - FAERS
      - adverse event reporting
      - FDA adverse
      - pharmacogenomics
      - pharmacogenetics
      - PGx
      - CPIC
      - CYP2D6
      - CYP2C9
      - CYP2C19
      - OPRM1
      - gene-drug interaction
      - metabolizer
      - drug metabolism

