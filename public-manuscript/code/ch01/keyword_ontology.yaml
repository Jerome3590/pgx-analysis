# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM DYNAMICS — Causal Links
# Format: {from, to, type, label, loop}
# ─────────────────────────────────────────────────────────────────────────────

causal_links:

  # ── Data Sources → Analytical Methods (feeds) ─────────────────────────────
  - from: data_sources::claims_apcd
    to:   analytical_methods::association_rules
    type: feeds
    label: "ICD/drug co-occurrence"
    rq: [N4]

  - from: data_sources::claims_apcd
    to:   analytical_methods::process_mining
    type: feeds
    label: "clinical event logs"
    rq: [N2, N3]

  - from: data_sources::claims_apcd
    to:   analytical_methods::temporal_analysis
    type: feeds
    label: "timestamped trajectories"
    rq: [RQ1, N1]

  - from: data_sources::claims_apcd
    to:   analytical_methods::gradient_boosting
    type: feeds
    label: "structured claim features"
    rq: [RQ1, RQ2]

  - from: data_sources::cpt_icd_codes
    to:   analytical_methods::association_rules
    type: feeds
    label: "procedure/diagnosis patterns"
    rq: [N4]

  - from: data_sources::cpt_icd_codes
    to:   analytical_methods::gradient_boosting
    type: feeds
    label: "CPT/ICD model features"
    rq: [RQ2]

  - from: data_sources::pharmacovigilance
    to:   clinical_outcomes::opioid_ed
    type: informs
    label: "FAERS adverse event signals"
    rq: [RQ2]

  - from: data_sources::pharmacovigilance
    to:   clinical_outcomes::polypharmacy_ed
    type: informs
    label: "DDI surveillance signals"
    rq: [RQ1]

  - from: data_sources::ehr_fhir
    to:   analytical_methods::gradient_boosting
    type: feeds
    label: "clinical context features"
    rq: [RQ1, RQ2]

  # ── Infrastructure → Methods (enables) ────────────────────────────────────
  - from: technical_infrastructure::scalable_analytics
    to:   analytical_methods::association_rules
    type: enables
    label: "parallel FP-Growth at scale"
    rq: [N4]

  - from: technical_infrastructure::scalable_analytics
    to:   analytical_methods::gradient_boosting
    type: enables
    label: "partitioned model training"
    rq: [RQ1, RQ2]

  - from: technical_infrastructure::routine_care_utilization
    to:   analytical_methods::temporal_analysis
    type: feeds
    label: "routine vs. non-routine flag"
    rq: [N1]

  - from: technical_infrastructure::target_leakage
    to:   analytical_methods::gradient_boosting
    type: prevents
    label: "enforces temporal cutoff"
    loop: B1
    rq: [RQ1, RQ2]

  # ── Analytical Method Chain (causal pipeline) ──────────────────────────────
  - from: analytical_methods::association_rules
    to:   analytical_methods::process_mining
    type: feeds
    label: "frequent co-occurrence context"
    rq: [N2, N3]

  - from: analytical_methods::association_rules
    to:   analytical_methods::gradient_boosting
    type: feeds
    label: "pattern-derived features"
    rq: [RQ1, RQ2]

  - from: analytical_methods::process_mining
    to:   analytical_methods::temporal_analysis
    type: feeds
    label: "event sequence clusters"
    rq: [N1, N2]

  - from: analytical_methods::process_mining
    to:   analytical_methods::gradient_boosting
    type: feeds
    label: "BupaR sequence features"
    rq: [RQ1, RQ2]

  - from: analytical_methods::temporal_analysis
    to:   analytical_methods::gradient_boosting
    type: feeds
    label: "DTW trajectory features"
    rq: [RQ1, N1]

  - from: analytical_methods::temporal_analysis
    to:   technical_infrastructure::target_leakage
    type: informs
    label: "temporal ordering required"
    loop: B1
    rq: [RQ1, RQ2]

  - from: analytical_methods::gradient_boosting
    to:   analytical_methods::explainable_ai
    type: feeds
    label: "model outputs for attribution"
    rq: [N5]

  # ── Methods → Clinical Outcomes ────────────────────────────────────────────
  - from: analytical_methods::gradient_boosting
    to:   clinical_outcomes::opioid_ed
    type: informs
    label: "opioid ED risk score"
    rq: [RQ2]

  - from: analytical_methods::gradient_boosting
    to:   clinical_outcomes::polypharmacy_ed
    type: informs
    label: "non-opioid ED risk score"
    rq: [RQ1]

  - from: analytical_methods::explainable_ai
    to:   clinical_outcomes::opioid_ed
    type: informs
    label: "SHAP/FFA causal drivers"
    rq: [N5]

  - from: analytical_methods::explainable_ai
    to:   clinical_outcomes::polypharmacy_ed
    type: informs
    label: "SHAP/FFA causal drivers"
    rq: [N5]

  - from: analytical_methods::association_rules
    to:   clinical_outcomes::polypharmacy_ed
    type: informs
    label: "drug co-occurrence patterns"
    rq: [N6]

  # ── Clinical Causal Loops (system dynamics) ────────────────────────────────
  - from: clinical_outcomes::polypharmacy_ed
    to:   clinical_outcomes::opioid_ed
    type: reinforces
    label: "↑ drug burden → ↑ opioid risk"
    loop: R1
    rq: [RQ1, RQ2]

  - from: clinical_outcomes::opioid_ed
    to:   clinical_outcomes::polypharmacy_ed
    type: reinforces
    label: "↑ comorbidity → ↑ polypharmacy"
    loop: R1
    rq: [RQ1, RQ2]

  # ── Balancing Loop: Leakage Prevention → Valid Prediction → Intervention ──
  - from: technical_infrastructure::target_leakage
    to:   clinical_outcomes::opioid_ed
    type: balances
    label: "valid model → ↓ ED risk via intervention"
    loop: B1
    rq: [RQ2]

  # ── OODA outer feedback: Act → Observe (new claims generated by outcome) ──
  - from: clinical_outcomes::opioid_ed
    to:   data_sources::claims_apcd
    type: reinforces
    label: "new ED claims → updated APCD (OODA feedback)"
    loop: R1
    ooda: act_to_observe
    rq: [RQ1, RQ2]

  - from: clinical_outcomes::polypharmacy_ed
    to:   data_sources::claims_apcd
    type: reinforces
    label: "new ED claims → updated APCD (OODA feedback)"
    loop: R1
    ooda: act_to_observe
    rq: [RQ1, RQ2]

# ─────────────────────────────────────────────────────────────────────────────
# OODA LOOP STRUCTURE
# Maps each ontology domain to the OODA decision cycle
# Source: Boyd, J.R. (1986). Patterns of Conflict.
# Applied to clinical analytics: each cycle = one monitoring period
# ─────────────────────────────────────────────────────────────────────────────

ooda_loop:

  observe:
    description: "Collect raw signals from the clinical environment"
    nodes:
      - data_sources::claims_apcd
      - data_sources::cpt_icd_codes
      - data_sources::pharmacovigilance
      - data_sources::ehr_fhir
      - technical_infrastructure::scalable_analytics
    key_question: "What happened? What data is available?"

  orient:
    description: "Analyse patterns, clean data, enforce temporal constraints"
    nodes:
      - analytical_methods::association_rules
      - analytical_methods::process_mining
      - analytical_methods::temporal_analysis
      - analytical_methods::target_leakage
      - technical_infrastructure::routine_care_utilization
    key_question: "What does the pattern mean? Is the data causally valid?"
    balancing_loop: B1

  decide:
    description: "Produce risk scores and causal explanations"
    nodes:
      - analytical_methods::gradient_boosting
      - analytical_methods::explainable_ai
    key_question: "What is the risk level and why? Which features drive it?"

  act:
    description: "Clinical intervention based on risk scores"
    nodes:
      - clinical_outcomes::opioid_ed
      - clinical_outcomes::polypharmacy_ed
    key_question: "What intervention is warranted? Was it effective?"
    reinforcing_loop: R1

  feedback:
    description: "Intervention outcomes generate new APCD claims (Act → Observe)"
    from: [clinical_outcomes::opioid_ed, clinical_outcomes::polypharmacy_ed]
    to:   [data_sources::claims_apcd]
    loop: R1
    note: "Tightening the OODA loop (faster Observe-Orient-Decide-Act) enables earlier intervention and attenuates R1."
    holdout_instantiation:
      description: "The 2019 prospective holdout dataset is the empirical instantiation of the OODA feedback."
      train_years: [2016, 2017, 2018]
      holdout_year: 2019
      excluded_year: 2020
      rationale: >
        Training on 2016–2018 (Observe → Orient → Decide) and evaluating on 2019
        (Act → Observe) directly tests whether the OODA cycle produces causally
        valid, temporally generalizable predictions. If R1 (polypharmacy ↔ opioid
        comorbidity) is real and B1 (leakage prevention) is correctly enforced,
        holdout PR-AUC should remain stable relative to CV performance.
        Divergence between CV and holdout metrics indicates either (a) temporal
        leakage survived B1, or (b) the R1 loop dynamics shifted between years.
