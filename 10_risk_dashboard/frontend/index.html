  // ---- PGx Cohort: Supporting Literature helpers ----

  function _renderPgxCitations(data) {
    const section  = document.getElementById("cohort-pgx-citations-section");
    const metaBar  = document.getElementById("cohort-pgx-citations-meta");
    const content  = document.getElementById("cohort-pgx-citations-content");
    const loading  = document.getElementById("cohort-pgx-citations-loading");
    if (!section || !content) return;
    if (loading) loading.style.display = "none";
    const citations = data.citations || {};
    const genes = Object.keys(citations);
    if (!genes.length) {
      content.innerHTML = '<p class="pgx-no-cits">No citations available for this cohort.</p>';
      section.style.display = "";
      return;
    }
    const ctxKw = data.context_keyword || "cohort context";
    if (data.gene_scores) window._pgxCohortGeneScores = data.gene_scores;
    const topDrugs = data.top_drugs && data.top_drugs.length ? " · Drugs: " + data.top_drugs.slice(0,3).join(", ") : "";
    if (metaBar) metaBar.textContent = genes.length + " genes queried · Date range: " + (data.date_range || "last 5 years") + " · Context: " + ctxKw + topDrugs;

    function _citList(items, label) {
      if (!items || !items.length) return '<p class="pgx-no-cits">No ' + label + ' citations found in the last 5 years.</p>';
      return '<ul class="pgx-citation-list">' + items.map(function(c) {
        var authors = (c.authors && c.authors.length) ? c.authors.join(", ") + (c.authors.length >= 3 ? " et al." : "") : "";
        var meta = [authors, c.journal, c.year].filter(Boolean).join(" · ");
        var ftLink = c.full_text_url ? ' · <a href="' + c.full_text_url + '" target="_blank" rel="noopener">Full text (PMC)</a>' : "";
        var pmcTag = c.pmc_id ? ' <span style="color:#94a3b8;font-size:0.72rem;">' + c.pmc_id + "</span>" : "";
        return '<li><a class="pgx-citation-title" href="' + c.url + '" target="_blank" rel="noopener">' + (c.title || c.pmid) + '</a><div class="pgx-citation-meta">' + meta + ftLink + pmcTag + '</div></li>';
      }).join("") + "</ul>";
    }

    content.innerHTML = genes.map(function(gene) {
      var g = citations[gene];
      var badges = (g.cpic_gene ? '<span class="pgx-cpic-badge">CPIC</span> ' : '') + (g.has_cpic_dosing_guideline ? '<span class="pgx-dosing-badge">Dosing</span>' : '');
      var vipLink = g.vip_url ? '<a class="pgx-vip-link" href="' + g.vip_url + '" target="_blank" rel="noopener" title="ClinPGx VIP page">VIP ↗</a>' : "";
      var fullName = g.gene_name ? '<span class="pgx-gene-full-name">' + g.gene_name + "</span>" : "";
      var pgxCount = (g.pharmacogenomics || []).length;
      var ctxCount = (g.cohort_context   || []).length;
      var total = pgxCount + ctxCount;
      var ctxLabel = ctxKw.charAt(0).toUpperCase() + ctxKw.slice(1);
      return '<details class="pgx-gene-card"><summary><span>' + gene + "</span> " + fullName + " " + badges + " " + vipLink + '<span class="pgx-cit-count">' + total + ' citation' + (total !== 1 ? 's' : '') + "</span></summary>"
        + '<div class="pgx-gene-card-body">'
        + '<div class="pgx-citations-group"><h4>Pharmacogenomics Evidence (' + pgxCount + ')</h4>' + _citList(g.pharmacogenomics, "pharmacogenomics") + "</div>"
        + '<div class="pgx-citations-group"><h4>' + ctxLabel + ' Context (' + ctxCount + ')</h4>' + _citList(g.cohort_context, ctxKw) + "</div>"
        + "</div></details>";
    }).join("");
    section.style.display = "";
  }

  async function _loadPgxCitations(citationsUrl) {
    var section = document.getElementById("cohort-pgx-citations-section");
    var loading = document.getElementById("cohort-pgx-citations-loading");
    if (!citationsUrl || !section) return;
    section.style.display = "";
    if (loading) loading.style.display = "";
    try {
      var resp = await fetch(citationsUrl);
      if (!resp.ok) { if (loading) loading.style.display = "none"; return; }
      _renderPgxCitations(await resp.json());
    } catch(e) {
      if (loading) loading.style.display = "none";
    }
  }

  async function _loadPgxRadar(radarUrl, containerId) {
    const cid = containerId || "cohort-pgx-radar-chart";
    if (!radarUrl || !window.Plotly) return;
    try {
      const resp = await fetch(radarUrl);
      if (!resp.ok) return;
      const fig = await resp.json();
      if (!fig.data || !fig.data.length) return;
      const container = document.getElementById(cid);
      if (!container) return;
      Plotly.react(container, fig.data, fig.layout || {}, { responsive: true, displayModeBar: false });
      if (cid === "cohort-pgx-radar-chart") {
        const sec = document.getElementById("cohort-pgx-radar-section");
        if (sec) sec.style.display = "";
      }
    } catch(e) { /* radar is optional */ }
  }

  function _renderPgxCardGeneList(citData) {
    const citations = citData.citations || {};
    const geneScores = citData.gene_scores || {};
    const genes = Object.keys(citations);
    const countEl = document.getElementById("pgx-cohort-gene-count");
    const contentEl = document.getElementById("pgx-cohort-genes-content");
    if (!contentEl) return;
    if (countEl) countEl.textContent = "(" + genes.length + " genes)";
    if (!genes.length) { contentEl.innerHTML = '<p style="color:#64748b;">No genes available for this cohort.</p>'; return; }
    contentEl.innerHTML = genes.map(function(gene) {
      var g = citations[gene], s = geneScores[gene] || {};
      var badges = (g.cpic_gene ? '<span class="pgx-cpic-badge">CPIC</span> ' : '') +
        (g.has_cpic_dosing_guideline ? '<span class="pgx-dosing-badge">Dosing</span> ' : '') +
        (g.vip_tier ? '<span style="background:#ede9fe;color:#6d28d9;font-size:0.7rem;padding:2px 6px;border-radius:9px;font-weight:600;">VIP ' + g.vip_tier + '</span> ' : '');
      var vipLink = g.vip_url ? '<a href="' + g.vip_url + '" target="_blank" rel="noopener" style="color:#6366f1;font-size:0.75rem;margin-left:4px;">ClinPGx ↗</a>' : "";
      var fullName = g.gene_name ? '<span style="color:#64748b;font-size:0.8rem;"> — ' + g.gene_name + '</span>' : "";
      var rank = s.causal_rank ? '<span style="color:#94a3b8;font-size:0.72rem;margin-left:6px;">#' + s.causal_rank + '</span>' : "";
      var cits = s.citation_count != null ? '<span style="color:#94a3b8;font-size:0.72rem;margin-left:6px;">' + s.citation_count + ' cit.</span>' : "";
      return '<div style="display:flex;align-items:center;gap:4px;padding:0.45rem 0.25rem;border-bottom:1px solid #f1f5f9;flex-wrap:wrap;">' +
        '<strong style="min-width:75px;">' + gene + '</strong>' + fullName + rank + cits +
        '<div style="margin-left:auto;display:flex;gap:3px;align-items:center;flex-wrap:wrap;">' + badges + vipLink + '</div></div>';
    }).join('');
  }

  async function loadCohortPgxProfile() {
    var cohort  = document.getElementById("pgx-card-cohort")?.value;
    var ageBand = document.getElementById("pgx-card-age-band")?.value;
    var bin     = document.getElementById("pgx-card-bin")?.value || "";
    var statusEl = document.getElementById("pgx-card-status");
    if (!cohort || !ageBand) {
      if (statusEl) { statusEl.textContent = "Please select cohort and age band"; statusEl.className = "status-message error"; }
      return;
    }
    if (statusEl) { statusEl.textContent = "Loading cohort PGx profile..."; statusEl.className = "status-message info"; }
    var profileSec = document.getElementById("pgx-cohort-profile-section");
    var snpSec = document.getElementById("pgx-snp-refine-section");
    if (profileSec) profileSec.style.display = "none";
    if (snpSec) snpSec.style.display = "none";
    try {
      var _bp = bin && bin !== "";
      var base = "visualizations/cohort_pgx/networks/" + cohort + "/" + ageBand + (_bp ? "/density/" + bin : "");
      var staticCitUrl   = staticJsonPath(base + "/pubmed_citations.json");
      var staticRadarUrl = staticJsonPath(base + "/pgx_radar_data.json");
      var citUrl = staticCitUrl, radarUrl = staticRadarUrl;
      var headResp = await fetch(staticCitUrl, { method: "HEAD" }).catch(function() { return null; });
      if (!headResp || !headResp.ok) {
        var binParam = _bp ? "&n_event_bin=" + encodeURIComponent(bin) : "";
        var apiResp = await fetch(API_BASE + "/visualizations/cohort_pgx?cohort=" + encodeURIComponent(cohort) + "&age_band=" + encodeURIComponent(ageBand) + binParam);
        if (apiResp.ok) {
          var apiData = await apiResp.json();
          if (apiData.citations_url) citUrl = apiData.citations_url;
          if (apiData.radar_chart_url) radarUrl = apiData.radar_chart_url;
        }
      }
      var citResp = await fetch(citUrl);
      if (!citResp.ok) throw new Error("Citations not available. Run the PGx pipeline (Step 1.5) and sync to S3.");
      var citData = await citResp.json();
      if (citData.gene_scores) window._pgxCohortGeneScores = citData.gene_scores;
      _renderPgxCardGeneList(citData);
      await _loadPgxRadar(radarUrl, "pgx-card-radar-chart");
      if (profileSec) profileSec.style.display = "";
      if (snpSec) snpSec.style.display = "";
      var binLabel = _bp ? " [" + bin + " density]" : "";
      var nGenes = citData.genes_queried || Object.keys(citData.citations || {}).length;
      if (statusEl) { statusEl.textContent = nGenes + " PGx genes identified" + binLabel + ". Enter variants below to personalize."; statusEl.className = "status-message success"; }
    } catch(err) {
      if (statusEl) { statusEl.textContent = "Error: " + err.message; statusEl.className = "status-message error"; }
    }
  }

  // Helper: strip item_ prefix for display on scenario charts (x-axis / labels only)
  function stripItemPrefix(s) { if (s == null) return ''; return String(s).replace(/^item_/i, ''); }

  // Helper functions to render visualizations
  function renderScenarioCharts(data) {
    const hasWhatIf = data.interaction_factors_whatif && data.interaction_factors_whatif.length > 0;
    // Interaction factors bar chart (optionally two traces: current + what-if)
    if (data.interaction_factors && data.interaction_factors.length > 0) {
      const traceCurrent = {
        x: data.interaction_factors.map(f => stripItemPrefix(f.feature)),
        y: data.interaction_factors.map(f => f.importance),
        type: 'bar',
        name: 'Current',
        marker: { color: '#3b82f6' }
      };
      const traces = [traceCurrent];
      if (hasWhatIf) {
        traces.push({
          x: data.interaction_factors_whatif.map(f => stripItemPrefix(f.feature)),
          y: data.interaction_factors_whatif.map(f => f.importance),
          type: 'bar',
          name: 'What-if',
          marker: { color: '#f59e0b' }
        });
      }
      Plotly.newPlot('scenario-factors-chart', traces, {
        title: hasWhatIf ? 'Top Interaction Factors: Current vs What-if' : 'Top Interaction Factors',
        xaxis: { title: 'Feature' },
        yaxis: { title: 'Interaction Importance' },
        barmode: hasWhatIf ? 'group' : 'relative',
        showlegend: !!hasWhatIf
      }, { responsive: true });
    }
    // SHAP importance bar chart (optionally two traces)
    const hasWhatIfShap = data.shap_importance_whatif && data.shap_importance_whatif.length > 0;
    if (data.shap_importance && data.shap_importance.length > 0) {
      const traceCurrent = {
        x: data.shap_importance.map(f => stripItemPrefix(f.feature)),
        y: data.shap_importance.map(f => f.importance),
        type: 'bar',
        name: 'Current',
        marker: { color: '#0f766e' }
      };
      const traces = [traceCurrent];
      if (hasWhatIfShap) {
        traces.push({
          x: data.shap_importance_whatif.map(f => stripItemPrefix(f.feature)),
          y: data.shap_importance_whatif.map(f => f.importance),
          type: 'bar',
          name: 'What-if',
          marker: { color: '#d97706' }
        });
      }
      Plotly.newPlot('shap-importance-chart', traces, {
        title: hasWhatIfShap ? 'SHAP Feature Importance: Current vs What-if' : 'SHAP Feature Importance',
        xaxis: { title: 'Feature' },
        yaxis: { title: 'SHAP Importance' },
        barmode: hasWhatIfShap ? 'group' : 'relative',
        showlegend: !!hasWhatIfShap
      }, { responsive: true });
    }
    // Feature / drug interactions (when Lambda includes feature_interactions from scenario data)
    const interactionsEl = document.getElementById('interactions-chart');
    if (interactionsEl) {
      if (data.feature_interactions && Array.isArray(data.feature_interactions) && data.feature_interactions.length > 0) {
        const arr = data.feature_interactions;
        const labels = arr.map(function(d) { return (d.features && d.features.map(stripItemPrefix).join(' × ')) || stripItemPrefix(d.feature) || JSON.stringify(d); });

  const DTW_VISUAL_KEYS = [
    { key: 'overview', label: 'Trajectory Overview' },

    { key: 'high_risk', label: 'High-Risk vs Low-Risk' },
    { key: 'times_between', label: 'Times Between / Time to Target' },

    { key: 'sequence_heatmap', label: 'Sequence Heatmap (Drug/ICD/CPT)' },

  const DTW_STORAGE_KEY = 'dtw_visuals_selection';
  function getDTWVisualSelection(cohort) {
    try {
      const raw = localStorage.getItem(DTW_STORAGE_KEY);
      if (!raw) return DTW_VISUAL_KEYS.map(v => v.key);
      const obj = JSON.parse(raw);
      const stored = obj && typeof obj === 'object' ? obj[cohort] : undefined;
      return Array.isArray(stored) ? stored : DTW_VISUAL_KEYS.map(v => v.key);
    } catch (_) {
      return DTW_VISUAL_KEYS.map(v => v.key);
    }
  }
  function setDTWVisualSelection(cohort, keys) {
    try {
      const raw = localStorage.getItem(DTW_STORAGE_KEY);
      const obj = raw ? JSON.parse(raw) : {};
      obj[cohort] = keys;
      localStorage.setItem(DTW_STORAGE_KEY, JSON.stringify(obj));
    } catch (_) {}
  }
  function buildDTWVisualCheckboxes(cohort) {
    const container = document.getElementById('dtw-visual-checkboxes');

      const checked = selected.includes(key) ? ' checked' : '';
      return `<label style="white-space: nowrap;"><input type="checkbox" class="dtw-visual-cb" data-visual-key="${key}"${checked}> ${label}</label>`;
    }).join('');
    container.querySelectorAll('.dtw-visual-cb').forEach(cb => {
      cb.addEventListener('change', () => {
        const keys = Array.from(container.querySelectorAll('.dtw-visual-cb:checked')).map(c => c.dataset.visualKey);
        setDTWVisualSelection(cohort, keys);
        document.querySelectorAll('.dtw-panel').forEach(p => {
          p.style.display = keys.includes(p.dataset.visualKey) ? '' : 'none';
        });
        syncDTWRoutineSubtabVisibility(keys);
      });
    });
    syncDTWRoutineSubtabVisibility(selected);
  }
  function applyDTWPanelVisibility(selectedKeys) {
    const keys = selectedKeys && selectedKeys.length ? selectedKeys : DTW_VISUAL_KEYS.map(v => v.key);
    document.querySelectorAll('.dtw-panel').forEach(p => {
      p.style.display = keys.includes(p.dataset.visualKey) ? '' : 'none';
    });
    syncDTWRoutineSubtabVisibility(keys);
  }
  function syncDTWRoutineSubtabVisibility(selectedKeys) {
    const keys = selectedKeys && selectedKeys.length ? selectedKeys : DTW_VISUAL_KEYS.map(v => v.key);

        if (activeBtn && activeBtn.getAttribute('data-dtw-subtab') === 'routine') {

  }
  function renderDTWVisualizations(data, densityFilter, selectedKeys) {
    applyDTWPanelVisibility(selectedKeys);

      if (el) el.innerHTML = '<p class="status-message info" style="margin:0;">' + (msg || 'No data for this visual.') + '</p>';

    // DTW overview: prefer simple data JSON (frontend builds Plotly); else legacy fig.data/fig.layout; fallback image
    function buildDTWTrajectoryPlotly(payload) {

        if (is3d) {

        }

      });
      var nTraces = traces.length;
      var layout = {
        title: yearsOrder.length > 1 ? title + "<br>" + (yearLabels["0"] || "All Years") : title,
        height: is3d ? 700 : 500,
        showlegend: true

      if (is3d) {

    }
    const overviewEl = document.getElementById("dtw-overview-image");

        if (summary) {

          const parts = [
            'Total trajectories: ' + (summary.total_trajectories != null ? summary.total_trajectories.toLocaleString() : '—'),
            'Target=1 / Target=0: ' + (summary.target_counts ? (summary.target_counts.target_1 + ' / ' + summary.target_counts.target_0) : '—'),
            'With time-between (≥2 events): ' + (summary.trajectories_with_time_between != null ? summary.trajectories_with_time_between.toLocaleString() : '—'),

        } else if (data.metrics && Object.keys(data.metrics).length > 0) {

  function renderDTWSequenceHeatmap(heatmapData, codeType) {
    const container = document.getElementById('dtw-sequence-heatmap-container');
    if (!container) return;
    function setHeatmapEmpty(msg) {
      container.innerHTML = '<p class="status-message info" style="margin:0;">' + (msg || 'No data for this visual.') + '</p>';
    }
    if (!heatmapData) {
      setHeatmapEmpty('Sequence heatmap data not available. Run create_dtw_visuals and upload to dashboard.');
      return;
    }
    if (heatmapData.empty && heatmapData.message) {
      setHeatmapEmpty(heatmapData.message);
      return;
    }
    if (!heatmapData[codeType] || !heatmapData[codeType].codes || heatmapData[codeType].codes.length === 0) {
      setHeatmapEmpty('Sequence heatmap (' + codeType + ') has no data for this cohort/age band. Try another activity type (Drug / ICD / CPT) or run create_dtw_visuals so trajectories include ' + codeType + ' codes.');
      return;
    }
    try {
      const slice = heatmapData[codeType];
      let codes = slice.codes;
      const positions = slice.positions;
      let counts = slice.counts;
      // Sort by total count descending (highest-count codes first)
      const indices = codes.map((_, i) => i);
      indices.sort((a, b) => {
        const sumA = counts[a].reduce((s, v) => s + (Number(v) || 0), 0);
        const sumB = counts[b].reduce((s, v) => s + (Number(v) || 0), 0);
        return sumB - sumA;
      });
      codes = indices.map(i => codes[i]);
      counts = indices.map(i => counts[i]);
      const z = counts;
      const y = codes;
      const x = positions.map(p => 'Step ' + (p + 1));
      container.innerHTML = '<div id="dtw-sequence-heatmap-chart"></div>';
      Plotly.newPlot('dtw-sequence-heatmap-chart', [{
        z: z,
        x: x,
        y: y,
        type: 'heatmap',
        colorscale: [[0, 'rgb(255,255,224)'], [1, 'rgb(0,0,139)']],
        hovertemplate: '%{y} at %{x}: %{z} trajectories<extra></extra>'
      }], {
        title: 'Common sequences by position (' + codeType.toUpperCase() + ') — darker blue = higher count',
        xaxis: { title: 'Position in sequence' },
        yaxis: { title: 'Code', autorange: 'reversed' },
        margin: { t: 48, r: 120, b: 48, l: 120 }
      }, { responsive: true });
    } catch (e) {
      setHeatmapEmpty('This visual could not be displayed. The data may be missing or in an unexpected format.');
    }
  }


  function renderFPGrowthVisualizations(data, opts) {
    const TOP_N = 30;
    // Itemset Support Distribution: JSON first (Plotly from itemsets_data), then PNG fallback
    var supportEl = document.getElementById("fpgrowth-support-image");
    if (supportEl) {
      if (data.itemsets_data && Array.isArray(data.itemsets_data) && data.itemsets_data.length > 0) {
        function stripDrugPrefixForLabel(s) {
          return (s && typeof s === 'string') ? s.replace(/^DRUG:\s*/i, '').trim() : (s || '');
        }
        function normalizeDrugNameForLabel(s) {
          var t = stripDrugPrefixForLabel(s);
          if (!t) return '';
          return t
            .split(/\s+/)
            .map(function(w) { return w ? (w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()) : ''; })
            .join(' ')
            .trim();
        }
        function formatItemsetLabel(itemsets) {
          var arr = [];
          if (Array.isArray(itemsets)) {
            arr = itemsets;
          } else if (typeof itemsets === 'string') {
            arr = itemsets.split(',');
          } else if (itemsets != null) {
            arr = [String(itemsets)];
          }
          var cleaned = arr.map(normalizeDrugNameForLabel).filter(function(x) { return !!x; });
          return cleaned.join(' : ');
        }
        const rows = data.itemsets_data
          .map(function (r) {
            var items = r.itemsets;
            if (Array.isArray(items)) items = items.slice(0, 5);
            const label = formatItemsetLabel(items);
            return { label: label || "(empty)", support: Number(r.support) };
          })
          .filter(function (r) { return r.label && !isNaN(r.support); })
          .sort(function (a, b) { return b.support - a.support; })
          .slice(0, TOP_N);
        if (rows.length) {
          const y = rows.map(function (r) { return r.label; });
          const x = rows.map(function (r) { return r.support; });
          const divId = "fpgrowth-support-plotly";
          supportEl.innerHTML = "<div id=\"" + divId + "\" style=\"width:100%;height:500px;\"></div>";
          if (window.Plotly) {
            Plotly.newPlot(divId, [{
              type: "bar",
              x: x,
              y: y,
              orientation: "h",
              marker: { color: "teal" },
              hovertext: rows.map(function (r) { return "Support: " + r.support.toFixed(4); }),
              hoverinfo: "text"
            }], {
              margin: { l: 200, r: 50, t: 40, b: 50 },
              xaxis: { title: "Support", showgrid: true },
              yaxis: { title: "Itemset", autorange: "reversed" },
              height: 500
            }, { responsive: true });
          }
        } else {
          supportEl.innerHTML = "<p class=\"status-message info\">No itemsets data for support distribution.</p>";
        }
      } else if (data.support_image) {
        supportEl.innerHTML = '<img src="' + data.support_image + '" style="max-width: 100%;" alt="Itemset support" />';
        var _img = supportEl.querySelector('img');
        if (_img) _img.onerror = function() { supportEl.innerHTML = ''; };
      } else {
        supportEl.innerHTML = "";
      }
    }
    // Network: use proxy URL so HTML is served with Content-Type text/html (renders in iframe instead of download)
    const networkEl = document.getElementById("fpgrowth-network-container");
    let networkUrl = data.network_combined_html || data.network_html;
    if (networkEl && (opts && opts.cohort && opts.ageBand)) {
      networkUrl = API_BASE + "/visualizations/fpgrowth/network_html?cohort=" + encodeURIComponent(opts.cohort) + "&age_band=" + encodeURIComponent(opts.ageBand) + (opts.nEventBin && opts.nEventBin !== "all" ? "&n_event_bin=" + encodeURIComponent(opts.nEventBin) : "");
    }
    if (networkEl && networkUrl) {
      if (networkUrl.startsWith("http://") || networkUrl.startsWith("https://")) {
        networkEl.innerHTML = "<iframe src=\"" + networkUrl + "\" style=\"width: 100%; height: 820px; border: 1px solid #ddd;\" title=\"FP-Growth drug association rules network\"></iframe>";
      } else {
        networkEl.innerHTML = networkUrl;
      }
    }
  }

        var tracePngUrl = data.trace_explorer_pre_image;

            var yearLabels = te.year_labels || {};

            var first = series[0];
            var y = first.trace_short || [];

              function updateTraceExplorer(idx) {

                }], { margin: { t: 40, r: 40, b: 40, l: 180 }, xaxis: { title: 'Frequency' }, yaxis: { title: '', automargin: true }, height: Math.max(500, (y0.length || 20) * 22) }, { responsive: true });

  const BUPAR_CHART_COLORS = { Drug: '#3b82f6', Diagnosis: '#ef4444', Procedure: '#10b981', Other: '#64748b' };

  function buildBupaRBarChart(containerId, segmentKey, freqData) {
    if (!freqData || typeof freqData !== 'object') return null;
    const seg = freqData[segmentKey];
    const dataArr = seg && seg.data;
    if (!seg || !Array.isArray(dataArr) || dataArr.length === 0) return null;
    const rawYearLabels = seg.year_labels || {};
    // Support both { "0": "All Years" } and { "0": ["All Years (2016-2018)"] }
    const yearLabels = {};
    Object.keys(rawYearLabels).forEach(k => {
      const v = rawYearLabels[k];
      yearLabels[k] = Array.isArray(v) ? (v[0] != null ? v[0] : k) : (v != null ? v : k);
    });
    const years = Object.keys(yearLabels).map(Number).sort((a, b) => a - b);
    const selectId = containerId.replace('bupar-chart-', 'bupar-year-');
    const select = document.getElementById(selectId);
    if (select) {
      select.innerHTML = years.map(y => `<option value="${y}">${yearLabels[String(y)] != null ? yearLabels[String(y)] : y}</option>`).join('');
    }
    const filterByYear = (year) => {
      const y = Number(year);
      return dataArr.filter(d => Number(d.year) === y).sort((a, b) => (b.count || 0) - (a.count || 0)).slice(0, 40);
    };
    const dataForYear = filterByYear(years.length ? years[0] : 0);
    const labels = dataForYear.map(d => d.activity_short || d.activity);
    const counts = dataForYear.map(d => d.count);
    const colors = dataForYear.map(d => BUPAR_CHART_COLORS[d.activity_type] || BUPAR_CHART_COLORS.Other);
    let container = document.getElementById(containerId);
    if (!container) return null;
    // Replace canvas with div for Plotly if needed
    if (container.tagName === 'CANVAS') {
      var wrap = container.parentElement;
      var div = document.createElement('div');
      div.id = containerId + '-plotly';
      div.style.height = '400px';
      wrap.innerHTML = '';
      wrap.appendChild(div);
      container = div;
    }
    const plotlyDivId = container.id;
    if (buparPlotlyDivs[segmentKey]) try { Plotly.purge(buparPlotlyDivs[segmentKey]); } catch (_) {}
    buparPlotlyDivs[segmentKey] = plotlyDivId;
    const trace = { y: labels, x: counts, type: 'bar', orientation: 'h', marker: { color: colors }, name: 'Frequency' };
    const layout = { margin: { l: 180 }, xaxis: { title: 'Frequency' }, yaxis: { autorange: 'reversed' }, showlegend: false, height: 400 };
    if (window.Plotly) Plotly.newPlot(plotlyDivId, [trace], layout, { responsive: true });
    if (select && window.Plotly) {
      select.onchange = () => {
        const data = filterByYear(select.value);
        const y = data.map(d => d.activity_short || d.activity);
        const x = data.map(d => d.count);
        const c = data.map(d => BUPAR_CHART_COLORS[d.activity_type] || BUPAR_CHART_COLORS.Other);
        Plotly.react(plotlyDivId, [{ y: y, x: x, type: 'bar', orientation: 'h', marker: { color: c }, name: 'Frequency' }], layout);
      };
    }
    return plotlyDivId;
  }

  function renderBupaRActivityFrequencyCharts(freqData) {
    if (typeof Plotly === 'undefined') return;
    if (!freqData || typeof freqData !== 'object') return;
    buildBupaRBarChart('bupar-chart-overall', 'overall', freqData);
    buildBupaRBarChart('bupar-chart-pre', 'pre_target', freqData);
    buildBupaRBarChart('bupar-chart-post', 'post_target', freqData);
  }

  // Populate age band dropdowns for visualization tabs (exclude 0-12; Risk Assessment min age 13)
  function populateAgeBands(cohort, selectElement) {
    const ageBands = ['13-24', '25-44', '45-54', '55-64', '65-74', '75-84', '85-114'];
    selectElement.innerHTML = ageBands.map(ab => `<option value="${ab}">${ab}</option>`).join('');
  }

  // Set visualization tabs' cohort and age band to match main cohort context (so user can change per-tab)
  function syncVisualizationCohortContext(cohort) {
    const defaultAgeBand = cohort === "opioid_ed" ? "25-44" : "65-74";
    const ageBandToSelect = currentAgeBand || defaultAgeBand;
    ['scenario', 'dtw', 'fpgrowth', 'bupar', 'cohort-pgx'].forEach(prefix => {
      const cohortSelect = document.getElementById(`${prefix}-cohort`);
      const ageBandSelect = document.getElementById(`${prefix}-age-band`);
      if (cohortSelect && ageBandSelect) {
        cohortSelect.value = cohort;
        populateAgeBands(cohort, ageBandSelect);
        if (ageBandSelect.querySelector(`option[value="${ageBandToSelect}"]`)) {
          ageBandSelect.value = ageBandToSelect;
        } else {
          ageBandSelect.selectedIndex = 0;
        }
      }
    });
  }

  // Update age bands when cohort changes on a visualization tab; BupaR: rebuild visual checkboxes per research question
  ['scenario', 'dtw', 'fpgrowth', 'bupar', 'cohort-pgx'].forEach(prefix => {
    const cohortSelect = document.getElementById(`${prefix}-cohort`);
    const ageBandSelect = document.getElementById(`${prefix}-age-band`);
    if (cohortSelect && ageBandSelect) {
      cohortSelect.addEventListener('change', () => {
        populateAgeBands(cohortSelect.value, ageBandSelect);
        if (prefix === 'bupar') {
          buildBupaRVisualCheckboxesIndex(cohortSelect.value);
          const keys = getBupaRVisualSelectionIndex(cohortSelect.value);
          document.querySelectorAll('.bupar-panel').forEach(p => {
            p.style.display = keys.includes(p.dataset.visualKey) ? '' : 'none';
          });
        }
        if (prefix === 'dtw') {
          buildDTWVisualCheckboxes(cohortSelect.value);
          applyDTWPanelVisibility(getDTWVisualSelection(cohortSelect.value));
        }
      });
      // Initialize
      populateAgeBands(cohortSelect.value, ageBandSelect);
    }
  });
  const buparCohortElIndex = document.getElementById('bupar-cohort');
  if (buparCohortElIndex) {
    buildBupaRVisualCheckboxesIndex(buparCohortElIndex.value);
    const keys = getBupaRVisualSelectionIndex(buparCohortElIndex.value);
    document.querySelectorAll('.bupar-panel').forEach(p => {
      p.style.display = keys.includes(p.dataset.visualKey) ? '' : 'none';
    });
  }
  const dtwCohortEl = document.getElementById('dtw-cohort');
  if (dtwCohortEl) {
    buildDTWVisualCheckboxes(dtwCohortEl.value);
    applyDTWPanelVisibility(getDTWVisualSelection(dtwCohortEl.value));
  }

  // Initialize the dashboard
  console.log("Initializing PGx Risk Dashboard...");
  
  // Prefetch model performance data in background so it's ready when first prediction runs
  loadModelPerformance();

  // Load metadata for default cohort (sets currentCohort; then update indicator and lists)
  loadMetadata("opioid_ed").then(() => {
    updateModelIndicator();
    renderPatientCodesTab();
    syncVisualizationCohortContext("opioid_ed");
    console.log("Metadata loaded successfully");
  });
})(); // end async IIFE – tab loader + dashboard init

</script>
</body>
</html>
