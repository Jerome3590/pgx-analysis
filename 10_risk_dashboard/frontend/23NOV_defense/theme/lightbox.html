<div id="image-lightbox-overlay" class="image-lightbox-overlay" aria-hidden="true">
  <!-- Top Navigation & Controls Header -->
  <div class="lightbox-header">
    <div class="lightbox-meta">
      <span class="lightbox-tag">Full-Page View</span>
      <span id="lightbox-caption" class="lightbox-caption"></span>
    </div>
    
    <div class="lightbox-controls">
      <div class="lightbox-btn-group">
        <button id="lightbox-zoom-out" class="lightbox-btn" title="Zoom Out (−)" aria-label="Zoom Out">−</button>
        <span id="lightbox-zoom-display" class="lightbox-zoom-display">Fit</span>
        <button id="lightbox-zoom-in" class="lightbox-btn" title="Zoom In (+)" aria-label="Zoom In">+</button>
      </div>

      <button id="lightbox-mode-toggle" class="lightbox-btn lightbox-btn-accent" title="Toggle Full Width / Fit to Screen">
        <span id="lightbox-mode-icon">↔</span>
        <span id="lightbox-mode-text">Fill Width</span>
      </button>

      <button id="lightbox-reset-btn" class="lightbox-btn" title="Reset View (0)">↺ Reset</button>
      <button id="lightbox-close-btn" class="lightbox-btn lightbox-btn-close" title="Close (Esc)">✕</button>
    </div>
  </div>

  <!-- Main Viewport / Scroll & Pan Canvas -->
  <div id="lightbox-viewport" class="lightbox-viewport mode-fit">
    <div id="lightbox-canvas" class="lightbox-canvas">
      <img id="lightbox-expanded-img" src="" alt="Expanded diagram" draggable="false" />
    </div>
  </div>

  <!-- Bottom Interaction Hint -->
  <div class="lightbox-footer">
    <span class="lightbox-hint">
      <strong>Navigation:</strong> <strong>Single-click anywhere on image</strong> (or press <kbd>Space</kbd> / <kbd>Esc</kbd>) to close • Mousewheel or <strong>+/−</strong> to zoom • Drag to pan
    </span>
  </div>
</div>

<div id="card-lightbox-overlay" class="card-lightbox-overlay" aria-hidden="true">
  <div class="lightbox-header">
    <div class="lightbox-meta">
      <span class="lightbox-tag">Card Focus View</span>
      <span id="card-lightbox-caption" class="lightbox-caption"></span>
    </div>
    <div class="lightbox-controls">
      <div class="lightbox-btn-group">
        <button id="card-zoom-out" class="lightbox-btn" title="Decrease Font Size (−)" aria-label="Decrease Font Size">A−</button>
        <span id="card-zoom-display" class="lightbox-zoom-display">100%</span>
        <button id="card-zoom-in" class="lightbox-btn" title="Increase Font Size (+)" aria-label="Increase Font Size">A+</button>
      </div>
      <button id="card-reset-btn" class="lightbox-btn" title="Reset Font Size (0)">↺ Reset</button>
      <button id="card-close-btn" class="lightbox-btn lightbox-btn-close" title="Close (Esc)">✕</button>
    </div>
  </div>
  <div id="card-lightbox-viewport" class="card-lightbox-viewport">
    <div id="card-lightbox-modal" class="card-lightbox-modal"></div>
  </div>
  <div class="lightbox-footer">
    <span class="lightbox-hint">
      <strong>Card Focus View:</strong> <strong>Single-click anywhere on card</strong> (or press <kbd>Space</kbd> / <kbd>Esc</kbd>) to close • Use <strong>A+/A−</strong> or <strong>+/−</strong> keys to scale font
    </span>
  </div>
</div>

<script>
(function() {
  let openImageLightboxFn = null;

  function sanitizeMathText(container) {
    if (!container) return '';
    const clone = container.cloneNode(true);

    const scripts = Array.from(clone.querySelectorAll('script[type*="math"]'));
    scripts.forEach(script => {
      let tex = script.textContent || '';
      tex = tex
        .replace(/\\text\{([^}]+)\}/g, '$1')
        .replace(/_\{([^}]+)\}/g, '_$1')
        .replace(/\\cap/g, '∩')
        .replace(/\\ge/g, '≥')
        .replace(/\\le/g, '≤')
        .replace(/\\to/g, '→')
        .replace(/\\sum/g, 'Σ')
        .replace(/\\mathbb\{I\}/g, '𝕀')
        .replace(/\\in/g, '∈')
        .replace(/\\tau/g, 'τ')
        .replace(/\\Delta/g, 'Δ')
        .replace(/\\times/g, '×')
        .replace(/[\$\{\}\\]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      
      const parentMath = script.closest('span.math, .math');
      if (parentMath) {
        parentMath.replaceWith(document.createTextNode(' ' + tex + ' '));
      } else {
        script.replaceWith(document.createTextNode(' ' + tex + ' '));
      }
    });

    clone.querySelectorAll('.MJX_Assistive_MathML, .MathJax_Preview, .MathJax, annotation, .print-hide, script').forEach(el => el.remove());
    return (clone.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function initLightbox() {
    const overlay = document.getElementById('image-lightbox-overlay');
    const viewport = document.getElementById('lightbox-viewport');
    const canvas = document.getElementById('lightbox-canvas');
    const expandedImg = document.getElementById('lightbox-expanded-img');
    const captionEl = document.getElementById('lightbox-caption');
    const closeBtn = document.getElementById('lightbox-close-btn');
    const zoomInBtn = document.getElementById('lightbox-zoom-in');
    const zoomOutBtn = document.getElementById('lightbox-zoom-out');
    const zoomDisplay = document.getElementById('lightbox-zoom-display');
    const modeToggleBtn = document.getElementById('lightbox-mode-toggle');
    const modeText = document.getElementById('lightbox-mode-text');
    const modeIcon = document.getElementById('lightbox-mode-icon');
    const resetBtn = document.getElementById('lightbox-reset-btn');

    if (!overlay || !expandedImg || !viewport) return;

    // View state
    let currentMode = 'fit'; // 'fit' | 'fill-width' | 'custom-zoom'
    let currentScale = 1.0;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let hasDragged = false;

    function applyTransform() {
      if (currentMode === 'fit') {
        viewport.className = 'lightbox-viewport mode-fit';
        canvas.style.transform = '';
        expandedImg.style.transform = '';
        zoomDisplay.textContent = 'Fit';
        modeText.textContent = 'Fill Width';
        modeIcon.textContent = '↔';
      } else if (currentMode === 'fill-width') {
        viewport.className = 'lightbox-viewport mode-fill-width';
        canvas.style.transform = '';
        expandedImg.style.transform = '';
        zoomDisplay.textContent = 'Width';
        modeText.textContent = 'Fit Screen';
        modeIcon.textContent = '↕';
      } else {
        viewport.className = 'lightbox-viewport mode-custom';
        canvas.style.transform = `translate(${panX}px, ${panY}px)`;
        expandedImg.style.transform = `scale(${currentScale})`;
        zoomDisplay.textContent = `${Math.round(currentScale * 100)}%`;
        modeText.textContent = 'Fit Screen';
        modeIcon.textContent = '↕';
      }
    }

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'fit') {
        currentScale = 1.0;
        panX = 0;
        panY = 0;
        viewport.scrollTop = 0;
        viewport.scrollLeft = 0;
      } else if (mode === 'fill-width') {
        currentScale = 1.0;
        panX = 0;
        panY = 0;
        viewport.scrollTop = 0;
        viewport.scrollLeft = 0;
      } else if (mode === 'custom-zoom') {
        // keep current scale and pan
      }
      applyTransform();
    }

    function zoomBy(delta) {
      if (currentMode === 'fit' || currentMode === 'fill-width') {
        currentScale = currentMode === 'fit' ? 1.0 : 1.5;
        currentMode = 'custom-zoom';
      }
      currentScale = Math.min(Math.max(currentScale + delta, 0.4), 4.0);
      currentMode = 'custom-zoom';
      applyTransform();
    }

    function toggleMode() {
      if (currentMode === 'fit') {
        setMode('fill-width');
      } else {
        setMode('fit');
      }
    }

    function openLightbox(imgSrc, captionText) {
      expandedImg.src = imgSrc;
      captionEl.innerText = captionText || '';
      overlay.classList.add('active');
      overlay.setAttribute('aria-hidden', 'false');

      // Standardize pop-out logic across all diagrams:
      // Default to Fill Width mode (up to 94vw / 1500px) so every diagram pops out bold, scaled, and instantly legible!
      function applyDefaultMode() {
        setMode('fill-width');
      }

      if (expandedImg.complete && expandedImg.naturalWidth > 0) {
        applyDefaultMode();
      } else {
        expandedImg.onload = applyDefaultMode;
      }


      // Temporarily disable Reveal keyboard navigation while lightbox is active
      if (window.Reveal) {
        window.Reveal.configure({ keyboard: false });
      }
    }

    openImageLightboxFn = openLightbox;
    window.openImageLightbox = openLightbox;
    window.closeImageLightbox = closeLightbox;

    function closeLightbox() {
      overlay.classList.remove('active');
      overlay.setAttribute('aria-hidden', 'true');
      expandedImg.src = '';
      captionEl.innerText = '';
      setMode('fit');

      // Re-enable Reveal keyboard navigation
      if (window.Reveal) {
        window.Reveal.configure({ keyboard: true });
      }
    }

    function getCleanCaption(frame, img) {
      const cap = frame ? frame.querySelector('.caption') : null;
      if (!cap) return img.getAttribute('alt') || '';
      return sanitizeMathText(cap) || img.getAttribute('alt') || '';
    }

    function bindImages() {
      const zoomableImages = document.querySelectorAll('.figure-frame img, img.zoomable, .reveal .slides img');
      zoomableImages.forEach(img => {
        if (img.classList.contains('no-zoom')) return;
        if (img.closest('.infographic-swap-container')) return;

        img.style.cursor = 'zoom-in';

        img.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();

          const frame = img.closest('.figure-frame') || img.parentElement;
          const caption = getCleanCaption(frame, img);
          const src = img.getAttribute('data-popout') || img.getAttribute('src') || img.getAttribute('data-src');

          if (src) {
            openLightbox(src, caption);
          }
        };
      });

      document.querySelectorAll('.figure-frame').forEach(frame => {
        if (frame.dataset.frameBound === 'true') return;
        frame.dataset.frameBound = 'true';
        frame.addEventListener('click', function(e) {
          if (e.target.closest('a, button')) return;
          const img = frame.querySelector('img:not(.no-zoom)');
          if (!img) return;
          e.preventDefault();
          e.stopPropagation();
          const caption = getCleanCaption(frame, img);
          const src = img.getAttribute('data-popout') || img.getAttribute('src') || img.getAttribute('data-src');
          if (src) {
            openLightbox(src, caption);
          }
        });
      });
    }

    // Event Listeners
    closeBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      closeLightbox();
    });

    modeToggleBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      toggleMode();
    });

    resetBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      setMode('fit');
    });

    zoomInBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      zoomBy(0.25);
    });

    zoomOutBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      zoomBy(-0.25);
    });

    // Single-click on expanded image closes lightbox (if not dragged)
    expandedImg.addEventListener('click', function(e) {
      e.stopPropagation();
      if (hasDragged) {
        hasDragged = false;
        return;
      }
      closeLightbox();
    });

    // Mouse wheel zoom over viewport
    viewport.addEventListener('wheel', function(e) {
      if (e.ctrlKey || currentMode === 'custom-zoom') {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.2 : -0.2;
        zoomBy(delta);
      }
    }, { passive: false });

    // Drag to Pan functionality
    viewport.addEventListener('mousedown', function(e) {
      if (e.target === closeBtn || e.target.closest('.lightbox-header')) return;
      isDragging = true;
      hasDragged = false;
      dragStartX = e.clientX - panX;
      dragStartY = e.clientY - panY;
      viewport.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      hasDragged = true;
      if (currentMode !== 'custom-zoom') {
        currentMode = 'custom-zoom';
      }
      panX = e.clientX - dragStartX;
      panY = e.clientY - dragStartY;
      applyTransform();
    });

    window.addEventListener('mouseup', function() {
      isDragging = false;
      if (viewport) {
        viewport.style.cursor = currentMode === 'custom-zoom' ? 'grab' : '';
      }
    });

    // Background click (outside image) closes lightbox
    viewport.addEventListener('click', function(e) {
      if (e.target === viewport || e.target === canvas) {
        if (!hasDragged) {
          closeLightbox();
        }
        hasDragged = false;
      }
    });

    // Keyboard controls
    window.addEventListener('keydown', function(e) {
      if (overlay.classList.contains('active')) {
        if (e.key === 'Escape' || e.keyCode === 27 || e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          e.stopPropagation();
          closeLightbox();
        } else if (e.key === '+' || e.key === '=') {
          e.preventDefault();
          zoomBy(0.25);
        } else if (e.key === '-' || e.key === '_') {
          e.preventDefault();
          zoomBy(-0.25);
        } else if (e.key === '0') {
          e.preventDefault();
          setMode('fit');
        } else if (e.key === 'w' || e.key === 'W' || e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          toggleMode();
        }
      }
    }, true);

    bindImages();

    if (window.Reveal) {
      window.Reveal.on('ready', bindImages);
      window.Reveal.on('slidechanged', bindImages);
    }
  }

  function initTitleSlideLogos() {
    const titleSlide = document.querySelector('#title-slide');
    if (!titleSlide || titleSlide.querySelector('.dual-logo-bar')) return;

    const usesParentDiagrams = !!document.querySelector('img[src^="../diagrams/"], img[data-src^="../diagrams/"]');
    const diagPrefix = usesParentDiagrams ? '../diagrams' : 'diagrams';

    const logoBar = document.createElement('div');
    logoBar.className = 'dual-logo-bar';
    logoBar.innerHTML = `
      <img src="${diagPrefix}/vcu_life_sciences_stacked.png" class="no-zoom logo-ls" alt="VCU School of Life Sciences and Sustainability" />
      <div class="logo-divider"></div>
      <img src="${diagPrefix}/vcu_pharmacy_logo.png" class="no-zoom logo-pharm" alt="VCU School of Pharmacy" />
    `;
    titleSlide.appendChild(logoBar);

    const pdfBar = document.createElement('div');
    pdfBar.className = 'title-pdf-bar print-hide';
    pdfBar.innerHTML = `
      <a href="final_defense_slides.pdf" target="_blank" rel="noopener" class="title-pdf-pill" title="Open / Download 16:9 Print-Ready PDF Slide Deck">📄 Presentation Slides (PDF) ↗</a>
    `;
    titleSlide.appendChild(pdfBar);
  }

  function initModuleNavBar() {
    const footer = document.querySelector('.reveal .footer');
    if (!footer) return;
    if (footer.querySelector('.footer-nav')) return;

    footer.innerHTML = `
      <span class="footer-candidate">R. Jerome Dixon, MDA, MSc IT · Ph.D. Defense</span>
      <nav class="footer-nav" aria-label="Presentation Module Navigation">
        <a href="#/sec-roadmap" class="nav-pill pill-road" id="nav-pill-road" title="Roadmap: 7 Core Modules (Slide 3)">Roadmap</a>
        <a href="#/slide-1" class="nav-pill pill-p1" id="nav-pill-p1" title="Module I: Problem">I. Problem</a>
        <a href="#/slide-2" class="nav-pill pill-p2" id="nav-pill-p2" title="Module II: Governance & Data">II. Governance</a>
        <a href="#/slide-4" class="nav-pill pill-p3" id="nav-pill-p3" title="Module III: Cohorts">III. Cohorts</a>
        <a href="#/slide-5" class="nav-pill pill-p4" id="nav-pill-p4" title="Module IV: Modeling">IV. Modeling</a>
        <a href="#/slide-8" class="nav-pill pill-p5" id="nav-pill-p5" title="Module V: Translation & Deployment">V. Translation</a>
        <a href="#/slide-res-ch2" class="nav-pill pill-p6" id="nav-pill-p6" title="Module VI: Empirical Results (CH2–CH5)">VI. Results</a>
        <a href="#/slide-next-steps" class="nav-pill pill-p7" id="nav-pill-p7" title="Module VII: Next Steps (Pending 9NOV Feedback)">VII. Next Steps</a>
        <a href="#/sec-appendix" class="nav-pill pill-app" id="nav-pill-app" title="Appendix: Technical Defenses (A1–A8)">Appendix</a>
        <a href="final_defense_slides.pdf" target="_blank" rel="noopener" class="nav-pill pill-pdf print-hide" id="nav-pill-pdf" title="Open / Download 16:9 Print-Ready PDF Slide Deck">📄 PDF ↗</a>
      </nav>
      <span class="footer-spacer"></span>
    `;

    footer.querySelectorAll('.nav-pill:not(.pill-pdf)').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const targetHash = link.getAttribute('href');
        if (window.Reveal) {
          if (targetHash.startsWith('#/')) {
            const slideId = targetHash.replace('#/', '');
            const targetSlide = document.getElementById(slideId);
            if (targetSlide) {
              const indices = window.Reveal.getIndices(targetSlide);
              window.Reveal.slide(indices.h, indices.v, indices.f);
              return;
            }
          }
          window.location.hash = targetHash;
        }
      });
    });

    function getSlideH(id, fallback) {
      const el = document.getElementById(id);
      if (el && window.Reveal) {
        const ind = window.Reveal.getIndices(el);
        if (ind && typeof ind.h === 'number') return ind.h;
      }
      return fallback;
    }

    function updateActiveNav() {
      if (!window.Reveal) return;
      const indices = window.Reveal.getIndices();
      const h = indices ? indices.h : 0;
      const currentSlide = window.Reveal.getCurrentSlide();

      // Title Slide (Index 0) -> hide footer completely
      if (h === 0 || (currentSlide && currentSlide.id === 'title-slide')) {
        footer.style.setProperty('display', 'none', 'important');
        return;
      } else {
        footer.style.setProperty('display', 'flex', 'important');
      }

      footer.querySelectorAll('.nav-pill').forEach(pill => pill.classList.remove('active'));

      const hRoad = getSlideH('sec-roadmap', 2);
      const hP1 = getSlideH('slide-1', 3);
      const hP2 = getSlideH('slide-2', 11);
      const hP3 = getSlideH('slide-4', 13);
      const hP4 = getSlideH('slide-5', 16);
      const hP5 = getSlideH('slide-8', 19);
      const hP6 = getSlideH('slide-res-ch2', 23);
      const hP7 = getSlideH('slide-next-steps', 32);
      const hQA = getSlideH('slide-qa', 33);
      const hApp = getSlideH('sec-appendix', 35);

      if (h === hRoad) {
        footer.querySelector('#nav-pill-road')?.classList.add('active');
      } else if (h >= hP1 && h < hP2) {
        footer.querySelector('#nav-pill-p1')?.classList.add('active');
      } else if (h >= hP2 && h < hP3) {
        footer.querySelector('#nav-pill-p2')?.classList.add('active');
      } else if (h >= hP3 && h < hP4) {
        footer.querySelector('#nav-pill-p3')?.classList.add('active');
      } else if (h >= hP4 && h < hP5) {
        footer.querySelector('#nav-pill-p4')?.classList.add('active');
      } else if (h >= hP5 && h < hP6) {
        footer.querySelector('#nav-pill-p5')?.classList.add('active');
      } else if (h >= hP6 && h < hP7) {
        footer.querySelector('#nav-pill-p6')?.classList.add('active');
      } else if (h >= hP7 && h < hQA) {
        footer.querySelector('#nav-pill-p7')?.classList.add('active');
      } else if (h >= hApp) {
        footer.querySelector('#nav-pill-app')?.classList.add('active');
      }
    }

    updateActiveNav();
    if (window.Reveal) {
      window.Reveal.on('slidechanged', updateActiveNav);
    }
  }

  function initCardLightbox() {
    const overlay = document.getElementById('card-lightbox-overlay');
    const viewport = document.getElementById('card-lightbox-viewport');
    const modal = document.getElementById('card-lightbox-modal');
    const captionEl = document.getElementById('card-lightbox-caption');
    const closeBtn = document.getElementById('card-close-btn');
    const zoomInBtn = document.getElementById('card-zoom-in');
    const zoomOutBtn = document.getElementById('card-zoom-out');
    const zoomDisplay = document.getElementById('card-zoom-display');
    const resetBtn = document.getElementById('card-reset-btn');

    if (!overlay || !viewport || !modal) return;

    let cardScale = 1.0;

    function applyCardScale() {
      modal.style.setProperty('--card-scale', String(cardScale));
      if (zoomDisplay) {
        zoomDisplay.textContent = `${Math.round(cardScale * 100)}%`;
      }
    }

    function openCardLightbox(cardEl) {
      const slide = cardEl.closest('section');
      const slideTitle = slide?.querySelector('h2, h1')?.innerText?.trim() || '';
      const titleEl = cardEl.querySelector('.card-title, h3, h4, .chair-name, .member-name');
      const cardTitle = sanitizeMathText(titleEl);
      if (captionEl) {
        captionEl.textContent = cardTitle && slideTitle ? `${slideTitle} — ${cardTitle}` : (cardTitle || slideTitle);
      }

      modal.className = 'card-lightbox-modal';
      ['card-primary', 'card-warning', 'card-danger', 'card-success', 'card-slate', 'card-teal', 'card-indigo'].forEach(cls => {
        if (cardEl.classList.contains(cls)) {
          modal.classList.add(cls);
        }
      });

      if (cardEl.tagName === 'TABLE' || cardEl.querySelector('table')) {
        modal.classList.add('card-modal-table');
      }

      if (cardEl.tagName === 'TABLE') {
        modal.innerHTML = cardEl.outerHTML;
        const clonedTable = modal.querySelector('table');
        if (clonedTable) {
          clonedTable.style.fontSize = '';
          clonedTable.style.lineHeight = '';
        }
      } else {
        modal.innerHTML = cardEl.innerHTML;
        modal.querySelectorAll('table').forEach(tbl => {
          tbl.style.fontSize = '';
          tbl.style.lineHeight = '';
        });
      }

      // Remove inline font-size overrides that MathJax v2 bakes onto .MathJax / .mjx-chtml based on tiny slide table font sizes
      modal.querySelectorAll('.MathJax, .mjx-chtml, .MathJax_CHTML').forEach(mj => {
        mj.style.fontSize = '';
      });

      // Wire internal appendix jump/return links inside the modal so clicking them closes the modal and navigates
      modal.querySelectorAll('a[href^="#/"]').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const targetHash = link.getAttribute('href');
          closeCardLightbox();
          if (window.Reveal && targetHash.startsWith('#/')) {
            const slideId = targetHash.replace('#/', '');
            const targetSlide = document.getElementById(slideId);
            if (targetSlide) {
              const ind = window.Reveal.getIndices(targetSlide);
              window.Reveal.slide(ind.h, ind.v, ind.f);
              return;
            }
          }
          window.location.hash = targetHash;
        });
      });

      cardScale = 1.0;
      applyCardScale();
      overlay.classList.add('active');
      overlay.setAttribute('aria-hidden', 'false');

      if (window.Reveal) {
        window.Reveal.configure({ keyboard: false });
      }
    }

    window.openCardLightbox = openCardLightbox;
    window.closeCardLightbox = closeCardLightbox;

    function closeCardLightbox() {
      overlay.classList.remove('active');
      overlay.setAttribute('aria-hidden', 'true');
      modal.innerHTML = '';
      if (window.Reveal) {
        window.Reveal.configure({ keyboard: true });
      }
    }

    function bindCards() {
      const selector = [
        '.reveal .slides .card-box',
        '.reveal .slides .committee-chair-card',
        '.reveal .slides .committee-member-strip',
        '.reveal .slides .takeaway-banner',
        '.reveal .slides table.table-compact'
      ].join(', ');

      document.querySelectorAll(selector).forEach(el => {
        if (el.dataset.cardBound === 'true') return;
        // Skip Roadmap (Slide 3) high-level module cards (handled by initRoadmapCards)
        if (el.closest('#sec-roadmap')) return;
        // Skip tables that are already inside a .card-box (clicking the card-box handles them)
        if (el.tagName === 'TABLE' && el.closest('.card-box')) return;

        el.dataset.cardBound = 'true';
        el.addEventListener('click', function(e) {
          const popoutImg = el.getAttribute('data-popout-img') || el.dataset.popoutImg;
          if (popoutImg) {
            e.preventDefault();
            e.stopPropagation();
            const caption = el.getAttribute('data-popout-caption') || el.dataset.popoutCaption || 'Figure 1B - FAERS vs APCD ADE Events';
            const fn = openImageLightboxFn || window.openImageLightbox;
            if (fn) {
              fn(popoutImg, caption);
            }
            return;
          }
          if (e.target.closest('a, button')) return;
          e.preventDefault();
          e.stopPropagation();
          openCardLightbox(el);
        });
      });
    }

    closeBtn?.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      closeCardLightbox();
    });

    zoomInBtn?.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      cardScale = Math.min(1.8, Math.round((cardScale + 0.15) * 100) / 100);
      applyCardScale();
    });

    zoomOutBtn?.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      cardScale = Math.max(0.75, Math.round((cardScale - 0.15) * 100) / 100);
      applyCardScale();
    });

    resetBtn?.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      cardScale = 1.0;
      applyCardScale();
    });

    viewport.addEventListener('click', function(e) {
      if (e.target.closest('a, button')) return;
      const sel = window.getSelection ? window.getSelection().toString() : '';
      if (sel && sel.length > 0) return;
      e.preventDefault();
      e.stopPropagation();
      closeCardLightbox();
    });

    window.addEventListener('keydown', function(e) {
      if (!overlay.classList.contains('active')) return;
      if (e.key === 'Escape' || e.keyCode === 27 || e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        e.stopPropagation();
        closeCardLightbox();
      } else if (e.key === '+' || e.key === '=') {
        e.preventDefault();
        cardScale = Math.min(1.8, Math.round((cardScale + 0.15) * 100) / 100);
        applyCardScale();
      } else if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        cardScale = Math.max(0.75, Math.round((cardScale - 0.15) * 100) / 100);
        applyCardScale();
      } else if (e.key === '0') {
        e.preventDefault();
        cardScale = 1.0;
        applyCardScale();
      }
    }, true);

    bindCards();
    if (window.Reveal) {
      window.Reveal.on('ready', bindCards);
      window.Reveal.on('slidechanged', bindCards);
    }
  }

  function initRoadmapCards() {
    const roadmap = document.getElementById('sec-roadmap');
    if (!roadmap || roadmap.dataset.roadmapBound === 'true') return;
    roadmap.dataset.roadmapBound = 'true';

    const cardTargets = [
      { selector: '.card-danger', targetId: 'slide-1', title: 'Module I: Problem' },
      { selector: '.card-primary', targetId: 'slide-2', title: 'Module II: Governance & Data' },
      { selector: '.card-warning', targetId: 'slide-4', title: 'Module III: Cohorts' },
      { selector: '.card-success', targetId: 'slide-5', title: 'Module IV: Modeling' },
      { selector: '.card-slate', targetId: 'slide-8', title: 'Module V: Translation & Deployment' },
      { selector: '.card-teal', targetId: 'slide-res-ch2', title: 'Module VI: Results (CH2–CH5)' },
      { selector: '.card-indigo', targetId: 'slide-next-steps', title: 'Module VII: Next Steps (Pending 9NOV Feedback)' }
    ];

    cardTargets.forEach(({ selector, targetId, title }) => {
      const card = roadmap.querySelector(selector);
      if (!card) return;
      card.style.cursor = 'pointer';
      card.setAttribute('title', `Click to navigate to ${title}`);
      card.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (window.Reveal) {
          const targetSlide = document.getElementById(targetId);
          if (targetSlide) {
            const indices = window.Reveal.getIndices(targetSlide);
            window.Reveal.slide(indices.h, indices.v, indices.f);
            window.location.hash = `#/${targetId}`;
          }
        }
      });
    });
  }

  function initInternalLinks() {
    if (document.body && document.body.dataset.internalLinksBound === 'true') return;
    if (document.body) document.body.dataset.internalLinksBound = 'true';

    document.addEventListener('click', function(e) {
      const link = e.target.closest('a[href^="#/"]');
      if (!link) return;
      // Skip if it's already a footer nav pill (handled by initModuleNavBar)
      if (link.closest('.footer-nav')) return;

      const targetHash = link.getAttribute('href');
      if (window.Reveal && targetHash && targetHash.startsWith('#/')) {
        e.preventDefault();
        e.stopPropagation();
        const slideId = targetHash.replace('#/', '');
        const targetSlide = document.getElementById(slideId);
        if (targetSlide) {
          if (window.closeImageLightbox) window.closeImageLightbox();
          if (window.closeCardLightbox) window.closeCardLightbox();
          const indices = window.Reveal.getIndices(targetSlide);
          window.Reveal.slide(indices.h, indices.v, indices.f);
          window.location.hash = targetHash;
        }
      }
    }, true);
  }

  function initInfographicSwap() {
    document.querySelectorAll('.infographic-swap-container').forEach(container => {
      const infographicView = container.querySelector('.swap-view-infographic');
      const bulletsView = container.querySelector('.swap-view-bullets');
      const returnPill = container.querySelector('.swap-return-pill');

      // Inject Zoom Visual button into infographicView if not already present
      if (infographicView && !infographicView.querySelector('.swap-zoom-btn')) {
        const zoomBtn = document.createElement('span');
        zoomBtn.className = 'swap-zoom-btn print-hide';
        zoomBtn.innerHTML = '🔍 Zoom Visual';
        zoomBtn.setAttribute('title', 'Expand high-resolution visual full screen');
        infographicView.appendChild(zoomBtn);

        zoomBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const img = infographicView.querySelector('img');
          const capEl = infographicView.querySelector('.swap-caption');
          const capText = capEl ? capEl.innerText.replace(/Click\s+infographic.*$/i, '').replace(/Click\s+visual.*$/i, '').trim() : (img?.getAttribute('alt') || '');
          const src = img?.getAttribute('data-popout') || img?.getAttribute('src');
          if (src && window.openImageLightbox) {
            window.openImageLightbox(src, capText);
          }
        });
      }

      if (container.dataset.swapBound === 'true') return;
      container.dataset.swapBound = 'true';

      // 1. Swapping TO bullets: Clicking on infographicView (image, caption, or hint pill)
      if (infographicView) {
        infographicView.addEventListener('click', function(e) {
          if (e.target.closest('a, button, .swap-zoom-btn')) return;
          e.preventDefault();
          e.stopPropagation();
          container.classList.add('swapped');
        });
      }

      // 2. Swapping BACK to infographic: Clicking return pill or return header bar
      if (returnPill) {
        returnPill.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          container.classList.remove('swapped');
        });
      }

      const returnHeader = container.querySelector('.swap-bullets-header');
      if (returnHeader) {
        returnHeader.addEventListener('click', function(e) {
          if (e.target.closest('a, button, .card-box')) return;
          e.preventDefault();
          e.stopPropagation();
          container.classList.remove('swapped');
        });
      }

      // 3. Bullets view: prevent uncaught clicks from bubbling to any parent
      if (bulletsView) {
        bulletsView.addEventListener('click', function(e) {
          if (e.target.closest('.swap-return-pill, .swap-bullets-header')) return;
          e.stopPropagation();
        });
      }
    });
  }

  function onInit() {
    initInfographicSwap();
    initLightbox();
    initCardLightbox();
    initRoadmapCards();
    initInternalLinks();
    initTitleSlideLogos();
    initModuleNavBar();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', onInit);
  } else {
    onInit();
  }

  if (window.Reveal) {
    window.Reveal.on('ready', () => {
      initInfographicSwap();
      initCardLightbox();
      initRoadmapCards();
      initInternalLinks();
      initTitleSlideLogos();
      initModuleNavBar();
    });
    window.Reveal.on('slidechanged', () => {
      initInfographicSwap();
      initRoadmapCards();
    });
  }
})();
</script>
