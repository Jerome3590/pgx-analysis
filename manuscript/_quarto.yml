project:
  type: default
  output-dir: output

format:
  pdf:
    pdf-engine: xelatex
    documentclass: article
    number-sections: true
    toc: false
    keep-tex: false
    geometry: margin=1in
    fontsize: 11pt
    fig-pos: 'H'
    include-in-header:
      text: |
        \PassOptionsToPackage{hidelinks}{hyperref}
        \usepackage{float}
  docx:
    reference-doc: templates/reference.docx
    number-sections: true
    toc: true
    toc-depth: 3
    highlight-style: github
    fig-dpi: 300
    fig-width: 6.5
    fig-height: 5.0

# Default bibliography – individual chapters add their own journal-specific .bib
bibliography: refs/discipline.bib
# csl: templates/ama.csl  # not used; chapters override with cite-method: natbib

execute:
  echo: false
  warning: false
  message: false
